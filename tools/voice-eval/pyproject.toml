[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voice_eval"]

[project]
name = "voice-eval"
version = "0.1.0"
description = "VoiceAgent(F-05 음성 심문) 용의자 프롬프트와 LLM 후보를 비교하는 도구"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "jsonschema>=4.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "unit: 네트워크 없이 도는 단위 테스트",
]

[tool.ruff]
line-length = 100
target-version = "py311"
